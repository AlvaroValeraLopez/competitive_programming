[project]
name = "euler-video"
version = "0.1.0"
description = "Vídeos matemáticos generados con código para «Euler, paso a paso»."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "manim>=0.22.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["euler_video"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
